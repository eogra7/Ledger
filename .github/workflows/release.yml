# Alpha: every merge to main that has a feat/fix/perf (or breaking) commit since the
#        last alpha gets the next version from Conventional Commits and is published
#        as a GitHub pre-release vX.Y.Z-alpha.N (and to CurseForge's alpha channel
#        once that's set up). A push to main (a merge done by hand) starts the
#        alpha as a separate manual-style run, the way Auto-merge does: the
#        packager won't build in a push run once a tag points at the commit.
# Promote: run this workflow by hand with mode "promote" once an alpha has been
#        tested in game. It needs approval in the "release" environment, then tags
#        the same commit vX.Y.Z and publishes it as a full release.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "alpha = release main as the next alpha if needed; promote = publish a tested alpha as a release"
        type: choice
        options: [promote, alpha]
        default: promote
      alpha:
        description: "promote: the alpha tag to release, e.g. v0.10.0-alpha.2 (blank = the newest alpha)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  start-alpha:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Start the alpha release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml -R "${{ github.repository }}" --ref main -f mode=alpha

  alpha:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'alpha'
    runs-on: ubuntu-latest
    env:
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Next version
        id: v
        run: python3 .github/scripts/release.py alpha

      - name: Tag
        if: steps.v.outputs.release == 'true'
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"

      - name: Package and publish
        if: steps.v.outputs.release == 'true'
        uses: BigWigsMods/packager@v2

  promote:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'promote'
    runs-on: ubuntu-latest
    environment: release
    env:
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version
        id: v
        env:
          ALPHA: ${{ inputs.alpha }}
        run: python3 .github/scripts/release.py promote "$ALPHA"

      - name: Tag the alpha's commit
        env:
          TAG: ${{ steps.v.outputs.tag }}
          SHA: ${{ steps.v.outputs.sha }}
        run: |
          mv CHANGELOG.md /tmp/CHANGELOG.md
          git checkout --quiet "$SHA"
          mv /tmp/CHANGELOG.md CHANGELOG.md
          git tag "$TAG"
          git push origin "$TAG"
          # the alpha's tag is on the same commit; drop it here (not on GitHub)
          # so the packager builds the release, not the alpha again
          for t in $(git tag --points-at HEAD); do
            if [ "$t" != "$TAG" ]; then git tag -d "$t"; fi
          done

      - name: Package and publish
        uses: BigWigsMods/packager@v2
