# Push a tag like v0.9.0 to build Ledger-v0.9.0.zip and publish it as a GitHub
# release. When the CF_API_KEY secret is set and Ledger.toc has an
# "## X-Curse-Project-ID:" line, the same zip is uploaded to CurseForge too.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag matches Ledger.toc
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          toc=$(grep -m1 '^## Version:' Ledger.toc | sed 's/^## Version: *//' | tr -d '\r')
          tag=${GITHUB_REF_NAME#v}
          if [ "$toc" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Ledger.toc version $toc"
            exit 1
          fi

      - name: Package and publish
        uses: BigWigsMods/packager@v2
